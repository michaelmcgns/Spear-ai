<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Spear Dialer</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Space+Grotesk:wght@300;400;500;600;700&display=swap" rel="stylesheet">
<style>
*{box-sizing:border-box;margin:0;padding:0}
:root{--bg:#6B6B6B;--bg2:#5A5A5A;--bg3:#4A4A4A;--gold:#111111;--gold2:#333333;--gold3:#000000;--text:#F5EFE0;--text2:#E8DFC8;--text3:#C8BFA8;--border:#888888}
body{font-family:'Space Grotesk',system-ui,sans-serif;background:var(--bg);color:var(--text);height:100vh;overflow:hidden;display:flex;flex-direction:column}
::-webkit-scrollbar{width:3px}::-webkit-scrollbar-track{background:var(--bg2)}::-webkit-scrollbar-thumb{background:var(--gold);border-radius:2px}

/* Layout */
#app{display:flex;height:100vh;overflow:hidden}
#left{width:280px;min-width:280px;border-right:1px solid var(--border);background:var(--bg2);display:flex;flex-direction:column;overflow:hidden}
#right{flex:1;display:flex;flex-direction:column;overflow:hidden}

/* Left panel */
#left-header{padding:12px;border-bottom:1px solid var(--border)}
#left-header h1{font-size:14px;font-weight:700;margin-bottom:8px}
#search-box{width:100%;padding:6px 10px;border:1px solid var(--border);border-radius:8px;font-size:11px;background:var(--bg3);color:var(--text);font-family:inherit;outline:none}
#search-box:focus{border-color:var(--gold)}
#filter-bar{display:flex;gap:4px;flex-wrap:wrap;margin-top:6px}
.filter-btn{font-size:9px;padding:2px 8px;border-radius:999px;border:1px solid var(--border);background:var(--bg3);color:var(--text);cursor:pointer;font-family:inherit;font-weight:600;transition:all .15s}
.filter-btn.active{background:var(--gold);border-color:var(--gold);color:var(--text)}
#lead-count{padding:4px 12px;font-size:9px;color:var(--text3);border-top:1px solid var(--border)}
#lead-list{flex:1;overflow-y:auto;padding:8px}
.lead-card{width:100%;text-align:left;padding:8px 10px;border-radius:10px;border:1px solid var(--border);background:var(--bg2);cursor:pointer;margin-bottom:4px;transition:all .15s;font-family:inherit}
.lead-card:hover{border-color:var(--gold2);background:var(--bg3)}
.lead-card.active{background:var(--bg3);border-color:var(--gold)}
.lead-card .name{font-size:11px;font-weight:600;color:var(--text)}
.lead-card .sub{font-size:9px;color:var(--text3);margin-top:2px;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.lead-card .meta{font-size:9px;color:var(--text3);margin-top:3px;display:flex;gap:6px;flex-wrap:wrap}
.lead-card .btc{color:var(--gold3);font-weight:600}
.status-badge{font-size:8px;padding:1px 6px;border-radius:999px;border:1px solid;font-weight:600;white-space:nowrap}
.s-new{background:rgba(59,130,246,.2);color:#93C5FD;border-color:rgba(59,130,246,.4)}
.s-contacted{background:rgba(234,179,8,.2);color:#FDE68A;border-color:rgba(234,179,8,.4)}
.s-follow_up{background:rgba(139,92,246,.2);color:#C4B5FD;border-color:rgba(139,92,246,.4)}
.s-closed{background:rgba(34,197,94,.2);color:#86EFAC;border-color:rgba(34,197,94,.4)}
.s-lost{background:var(--bg3);color:var(--text3);border-color:var(--border)}

/* Right panel */
#top-bar{display:flex;align-items:center;justify-content:space-between;padding:12px 20px;border-bottom:1px solid var(--border);background:var(--bg3);flex-shrink:0}
#lead-info h2{font-size:13px;font-weight:700}
#lead-info .details{font-size:10px;color:var(--text3);margin-top:3px;display:flex;gap:10px;flex-wrap:wrap}
#lead-info .details .lender{font-weight:600;color:var(--text2)}
#lead-info .details .mtg{font-weight:700;color:var(--text)}
#lead-info .details .btc{color:var(--gold3);font-weight:700}
#call-btn{display:flex;align-items:center;gap:6px;padding:8px 16px;background:#16A34A;color:#fff;border:none;border-radius:10px;font-size:12px;font-weight:700;cursor:pointer;font-family:inherit;white-space:nowrap;text-decoration:none;transition:background .15s}
#call-btn:hover{background:#15803D}

/* Tabs */
#tabs{display:flex;padding:0 20px;background:var(--bg3);border-bottom:1px solid var(--border);flex-shrink:0}
.tab{padding:10px 14px;font-size:11px;font-weight:600;border-bottom:2px solid transparent;color:var(--text3);cursor:pointer;transition:all .15s}
.tab.active{border-color:var(--text);color:var(--text)}

/* Tab content */
#tab-content{flex:1;overflow-y:auto;padding:16px 20px}

/* Script */
.script-section{border-radius:10px;border:1px solid;margin-bottom:8px;overflow:hidden}
.section-header{display:flex;align-items:center;justify-content:space-between;padding:10px 14px;cursor:pointer;user-select:none}
.section-badge{font-size:10px;font-weight:700;padding:2px 8px;border-radius:999px}
.section-body{padding:12px 14px;border-top:1px solid rgba(0,0,0,.06);background:rgba(255,255,255,.12);display:none}
.section-body.open{display:block}
.script-block{margin-bottom:12px}
.block-label{font-size:9px;font-weight:700;text-transform:uppercase;letter-spacing:.06em;color:#bbb;margin-bottom:6px}
.block-label.branch{color:#B45309}
.script-line{font-size:12px;line-height:1.6;padding:8px 10px;border-radius:8px;margin-bottom:6px;white-space:pre-wrap}
.line-neutral{color:#111;background:rgba(255,255,255,.08)}
.line-purple{background:rgba(139,92,246,.2);color:#111;border:1px solid rgba(139,92,246,.4)}
.line-red{background:rgba(239,68,68,.2);color:#111;border:1px solid rgba(239,68,68,.4)}
.line-action{background:rgba(0,0,0,.2);color:#ddd;font-style:italic;font-size:11px}
.color-key{font-size:10px;color:var(--text3);margin-bottom:12px;display:flex;gap:12px}
.key-dot{width:8px;height:8px;border-radius:50%;display:inline-block;margin-right:3px}

/* Inventory form */
.inv-section{margin-bottom:16px}
.inv-title{font-size:11px;font-weight:700;text-transform:uppercase;letter-spacing:.06em;color:var(--text3);margin-bottom:8px}
.inv-grid{display:grid;gap:8px}
.inv-grid-2{grid-template-columns:1fr 1fr}
.inv-grid-3{grid-template-columns:1fr 1fr 1fr}
.inv-field{display:flex;flex-direction:column;gap:2px}
.inv-label{font-size:9px;font-weight:600;text-transform:uppercase;letter-spacing:.05em;color:var(--text3)}
.inv-input{border:none;border-bottom:1px solid var(--border);background:transparent;font-size:12px;color:var(--text);font-family:inherit;padding:2px 0;outline:none;width:100%}
.inv-input:focus{border-color:var(--gold)}
.inv-card{background:var(--bg3);border:1px solid var(--border);border-radius:10px;padding:12px}
.inv-card-red{background:rgba(239,68,68,.1);border-color:rgba(239,68,68,.3)}
.inv-card-blue{background:rgba(59,130,246,.1);border-color:rgba(59,130,246,.3)}
.inv-card-gold{background:rgba(234,179,8,.1);border-color:rgba(234,179,8,.3)}
.inv-card-green{background:rgba(34,197,94,.1);border-color:rgba(34,197,94,.3)}
.toggle-group{display:flex;gap:6px;margin-top:4px}
.toggle-btn{font-size:10px;padding:3px 10px;border-radius:6px;border:1px solid var(--border);background:var(--bg2);color:var(--text);cursor:pointer;font-family:inherit;font-weight:600;transition:all .15s}
.toggle-btn.active{background:var(--text);color:#fff;border-color:var(--text)}
.toggle-btn.gold.active{background:var(--gold);color:#fff;border-color:var(--gold)}
.asset-grid{display:flex;flex-wrap:wrap;gap:6px;margin-top:6px}
.asset-btn{font-size:10px;padding:4px 10px;border-radius:6px;border:1px solid var(--border);background:var(--bg2);color:var(--text);cursor:pointer;font-family:inherit;font-weight:600;transition:all .15s;display:flex;align-items:center;gap:3px}
.asset-btn.active{background:var(--gold);color:#fff;border-color:var(--gold)}
.mindset-box{background:rgba(0,0,0,.25);border-radius:8px;padding:10px;font-size:11px;color:#eee;line-height:1.6;white-space:pre-wrap;margin-bottom:10px}
.chevron{transition:transform .2s;font-size:12px;color:var(--text3)}
.open .chevron{transform:rotate(180deg)}
</style>
</head>
<body>
<div id="app">
  <!-- LEFT: Lead list -->
  <div id="left">
    <div id="left-header">
      <h1>🎯 Spear Dialer</h1>
      <input type="text" id="search-box" placeholder="Search name, phone, lender…" oninput="filterLeads()">
      <div id="filter-bar">
        <button class="filter-btn active" onclick="setFilter('all',this)">All</button>
        <button class="filter-btn" onclick="setFilter('new',this)">New</button>
        <button class="filter-btn" onclick="setFilter('contacted',this)">Contacted</button>
        <button class="filter-btn" onclick="setFilter('follow_up',this)">Follow Up</button>
        <button class="filter-btn" onclick="setFilter('closed',this)">Closed</button>
      </div>
    </div>
    <div id="lead-list"></div>
    <div id="lead-count"></div>
  </div>

  <!-- RIGHT: Script + Inventory -->
  <div id="right">
    <div id="top-bar">
      <div id="lead-info">
        <h2 id="lead-name">Mortgage Protection Dialer</h2>
        <div class="details" id="lead-details">
          <span>Select a lead to begin</span>
        </div>
      </div>
      <a id="call-btn" href="/dashboard/live-call" target="_blank">
        📞 Start Call
      </a>
    </div>

    <div id="tabs">
      <div class="tab active" onclick="setTab('script',this)">📋 Script</div>
      <div class="tab" onclick="setTab('inventory',this)">📊 Financial Inventory</div>
    </div>

    <div id="tab-content">
      <div id="pane-script"></div>
      <div id="pane-inventory" style="display:none"></div>
    </div>
  </div>
</div>

// Status stored in localStorage
function getStatuses() { try { return JSON.parse(localStorage.getItem('spear_statuses')||'{}') } catch{return{}} }
function setStatus(i,s){ const d=getStatuses(); d[i]=s; localStorage.setItem('spear_statuses',JSON.stringify(d)); }

const LEADS = LEADS_RAW.map((l,i)=>({...l, id:i, status: getStatuses()[i]||'new'}));

let currentFilter = 'all';
let currentSearch = '';
let selectedId = null;

function setFilter(f, btn) {
  currentFilter = f;
  document.querySelectorAll('.filter-btn').forEach(b=>b.classList.remove('active'));
  btn.classList.add('active');
  renderLeads();
}

function filterLeads() {
  currentSearch = document.getElementById('search-box').value.toLowerCase();
  renderLeads();
}

function getFiltered() {
  return LEADS.filter(l => {
    const name = (l.fn+' '+l.ln).toLowerCase();
    const q = currentSearch;
    const matchSearch = !q || name.includes(q) || l.phone.includes(q) || l.lender.toLowerCase().includes(q) || l.addr.toLowerCase().includes(q);
    const matchStatus = currentFilter==='all' || l.status===currentFilter;
    return matchSearch && matchStatus;
  });
}

function renderLeads() {
  const list = document.getElementById('lead-list');
  const filtered = getFiltered();
  document.getElementById('lead-count').textContent = filtered.length + ' of ' + LEADS.length + ' leads';

  const STATUS_LABEL = {new:'New',contacted:'Contacted',follow_up:'Follow Up',closed:'Closed',lost:'Lost'};
  list.innerHTML = filtered.map(l => `
    <div class="lead-card ${selectedId===l.id?'active':''}" onclick="selectLead(${l.id})">
      <div style="display:flex;align-items:center;justify-content:space-between;gap:6px">
        <span class="name">${l.fn} ${l.ln}</span>
        <span class="status-badge s-${l.status}">${STATUS_LABEL[l.status]||l.status}</span>
      </div>
      <div class="sub">${l.phone||'No phone'}</div>
      <div class="meta">
        ${l.age?`<span>Age ${l.age}</span>`:''}
        ${l.lender?`<span>${l.lender.substring(0,22)}${l.lender.length>22?'…':''}</span>`:''}
        ${l.btc?`<span class="btc">${l.btc}</span>`:''}
      </div>
    </div>
  `).join('');
}

function selectLead(id) {
  selectedId = id;
  const l = LEADS[id];
  document.getElementById('lead-name').textContent = l.fn + ' ' + l.ln;
  document.getElementById('lead-details').innerHTML = `
    ${l.phone?`<span style="font-family:monospace">${l.phone}</span>`:''}
    ${l.mob?`<span style="font-family:monospace">M: ${l.mob}</span>`:''}
    ${l.addr?`<span>${l.addr}</span>`:''}
    ${l.lender?`<span class="lender">${l.lender}</span>`:''}
    ${l.mtg?`<span class="mtg">${l.mtg}</span>`:''}
    ${l.age?`<span>Age ${l.age}</span>`:''}
    ${l.btc?`<span class="btc">BTC: ${l.btc}</span>`:''}
  `;
  document.getElementById('call-btn').textContent = '📞 Call ' + l.fn;

  // Status selector
  const STATUS_OPTIONS = ['new','contacted','follow_up','closed','lost'];
  const STATUS_LABEL = {new:'New',contacted:'Contacted',follow_up:'Follow Up',closed:'Closed',lost:'Lost'};
  const statusHtml = `<div style="display:flex;gap:4px;margin-top:6px;flex-wrap:wrap">` +
    STATUS_OPTIONS.map(s=>`<button onclick="updateStatus(${id},'${s}')" style="font-size:9px;padding:2px 8px;border-radius:999px;border:1px solid;cursor:pointer;font-family:inherit;font-weight:600;${l.status===s?'background:#111;color:#fff;border-color:#111':'background:#fff;color:#555;border-color:#D4CABC'}">${STATUS_LABEL[s]}</button>`).join('') +
    `</div>`;
  document.getElementById('lead-details').insertAdjacentHTML('beforeend', statusHtml);

  renderLeads();
  prefillInventory(l);
  updateScriptTokens(l);
}

function updateStatus(id, status) {
  LEADS[id].status = status;
  setStatus(id, status);
  selectLead(id);
}

function updateScriptTokens(l) {
  const firstName = l.fn || '[Name]';
  const fullName  = (l.fn||'') + ' ' + (l.ln||'');
  const lender    = l.lender || '[Lender]';
  const addr      = l.addr   || '[Address]';
  const state     = l.st     || '[State]';
  // Extract street name (everything before first comma or full addr)
  const street = addr.split(',')[0] || addr;

  function fill(t) {
    return t
      // explicit placeholders
      .replace(/\_\(client'?s? ?name\)\_/gi, firstName)
      .replace(/\_\(your name\)\_/gi, '[Your Name]')
      .replace(/\_\(lender\)\_/gi, lender)
      .replace(/\_\(street name\)\_/gi, street)
      .replace(/__\(address\)__/gi, addr)
      .replace(/__\(Address\)__/gi, addr)
      .replace(/\_\(state\)\_/gi, state)
      .replace(/__\(state\)__/gi, state)
      // angle-bracket tokens
      .replace(/<Name>/gi, firstName)
      .replace(/<NAME>/gi, firstName)
      .replace(/<CLIENT>/g, firstName)
      // bare parens in script lines
      .replace(/\(client'?s? ?name\)/gi, firstName)
      .replace(/\(lender\)/gi, lender)
      .replace(/\(Address\)/gi, addr)
      .replace(/\(address\)/gi, addr)
      .replace(/\(state\)/gi, state);
  }

  document.querySelectorAll('#pane-script [data-orig]').forEach(el => {
    const orig = el.getAttribute('data-orig');
    el.textContent = fill(orig);
  });
}

function renderScript() {
  const container = document.getElementById('pane-script');
  container.innerHTML = `

      <span><span class="key-dot" style="background:#8B5CF6;display:inline-block"></span> <b style="color:#3B0764">Purple</b> = chill & blasé (smile 😊)</span>
      <span><span class="key-dot" style="background:#EF4444;display:inline-block"></span> <b style="color:#7F1D1D">Red</b> = slightly annoyed & assertive</span>
    </div>
    ${SCRIPT.map(s => `
      <div class="script-section" style="border-color:${s.border};background:${s.bg}">
        <div class="section-header" onclick="toggleSection('${s.id}',this)">
          <span class="section-badge" style="${s.badge}">${s.label}</span>
          <span class="chevron">▼</span>
        </div>
        <div class="section-body" id="body-${s.id}">
          ${s.content.map(block => {
            if(block.type==='mindset') return `<div class="mindset-box">${block.text}</div>`;
            const labelClass = block.type==='branch' ? 'block-label branch' : 'block-label';
            const arrow = block.type==='branch' ? '↳ ' : '';
            return `<div class="script-block">
              ${block.label ? `<div class="${labelClass}">${arrow}${block.label}</div>` : ''}
              ${(block.lines||[]).map(line => {
                const isAction = line.t.startsWith('*') || line.t.includes('*(');
                const cls = line.c==='purple' ? 'script-line line-purple' : line.c==='red' ? 'script-line line-red' : isAction ? 'script-line line-action' : 'script-line line-neutral';
                const prefix = line.c==='purple' ? '🟣 ' : line.c==='red' ? '🔴 ' : '';
                return `<div class="${cls}" data-orig="${prefix}${line.t.replace(/"/g,'&quot;')}">${prefix}${line.t}</div>`;
              }).join('')}
            </div>`;
          }).join('')}
        </div>
      </div>
    `).join('')}
  `;
}

function toggleSection(id, header) {
  const body = document.getElementById('body-'+id);
  const chevron = header.querySelector('.chevron');
  const isOpen = body.style.display !== 'none' && body.classList.contains('open');
  if(isOpen) { body.classList.remove('open'); body.style.display='none'; header.classList.remove('open'); }
  else { body.classList.add('open'); body.style.display='block'; header.classList.add('open'); }
}

function setTab(name, btn) {
  document.querySelectorAll('.tab').forEach(t=>t.classList.remove('active'));
  btn.classList.add('active');
  document.getElementById('pane-script').style.display = name==='script' ? 'block' : 'none';
  document.getElementById('pane-inventory').style.display = name==='inventory' ? 'block' : 'none';
}

        <p style="margin-top:6px;font-size:12px;color:#166534;font-style:italic;line-height:1.6">Now, (name) if you were to pass away, what would the situation look like financially for the family?</p>
        <p style="margin-top:6px;font-size:12px;color:#166534;font-style:italic;line-height:1.6">So if I were able to find something comfortable and affordable that would avoid that situation and pay off the home, that would be important to you correct?</p>
      </div>
    </div>
  `;
}

function personBlock(n) {
  return `<div class="inv-card">
    <div class="inv-title">Person ${n}</div>
    <div style="display:grid;gap:6px">
      <div class="inv-field"><label class="inv-label">Full Name</label><input class="inv-input" id="f-name${n}"></div>
      <div style="display:grid;grid-template-columns:1fr 1fr;gap:6px">
        <div class="inv-field"><label class="inv-label">Age</label><input class="inv-input" id="f-age${n}"></div>
        <div class="inv-field"><label class="inv-label">DOB</label><input class="inv-input" id="f-dob${n}"></div>
      </div>
      <div class="inv-field"><label class="inv-label">Occupation</label><input class="inv-input" id="f-occ${n}"></div>
      <div style="display:grid;grid-template-columns:1fr 1fr 1fr;gap:6px">
        <div class="inv-field"><label class="inv-label">Smoker</label><input class="inv-input" id="f-smk${n}" placeholder="Y/N"></div>
        <div class="inv-field"><label class="inv-label">Height</label><input class="inv-input" id="f-ht${n}"></div>
        <div class="inv-field"><label class="inv-label">Weight</label><input class="inv-input" id="f-wt${n}"></div>
      </div>
      <div class="inv-field"><label class="inv-label">Major surgeries (last 20 yrs)</label><input class="inv-input" id="f-surg${n}"></div>
      <div class="inv-field"><label class="inv-label">Prescribed medications</label><input class="inv-input" id="f-meds${n}"></div>
      <div class="inv-field"><label class="inv-label">Bankruptcies (last 10 yrs)</label><input class="inv-input" id="f-bk${n}"></div>
      <div class="inv-field"><label class="inv-label">DUIs or Felonies</label><input class="inv-input" id="f-dui${n}"></div>
    </div>
  </div>`;
}

function prefillInventory(l) {
  const safe = (id,val) => { const el=document.getElementById(id); if(el&&val) el.value=val; };
  safe('f-name1', l.fn+' '+l.ln);
  safe('f-age1', l.age);
  safe('f-dob1', l.dob);
  safe('f-addr', l.addr);
  safe('f-balance', l.mtg.replace('$','').replace(',','') ? l.mtg : '');
  safe('f-phone', l.phone);
}

function toggleTerm(v) {
  ['15','20','30'].forEach(t=>{ const b=document.getElementById('term-'+t); if(b) b.classList.toggle('active',t===v); });
}
function toggleType(v) {
  ['Refinanced','Purchased'].forEach(t=>{ const b=document.getElementById('type-'+t); if(b) b.classList.toggle('active',t===v); });
}
function toggleForever(v) {
  ['Yes','No'].forEach(t=>{ const b=document.getElementById('fhome-'+t); if(b) b.classList.toggle('active',t===v); });
  const noDiv=document.getElementById('forever-no');
  if(noDiv) noDiv.style.display = v==='No'?'block':'none';
}
function toggleLI(v) {
  ['li-yes','li-no'].forEach(id=>{ const b=document.getElementById(id); if(b) b.classList.toggle('active',id==='li-'+v.toLowerCase()); });
  const det=document.getElementById('li-details');
  if(det) det.style.display=v==='Yes'?'block':'none';
  ['li-private','li-work'].forEach(id=>{ const b=document.getElementById(id); if(b) b.style.display=v==='Yes'?'':'none'; });
}
function toggleLIType(v) {
  ['Private','Work'].forEach(t=>{ const b=document.getElementById('li-'+t.toLowerCase()); if(b) b.classList.toggle('active',t===v); });
}
function toggleLITerm(v) {
  ['Term','Whole Life'].forEach(t=>{ const b=document.getElementById('lit-'+t.toLowerCase().replace(' ','')); if(b) b.classList.toggle('active',t===v); });
}
function toggleAsset(name, btn) { btn.classList.toggle('active'); }

renderLeads();
renderScript();
renderInventory();
</script>
